<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТВПК Цифровая Экосистема</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }

</head>
<body class="bg-[#f1f1f1] h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Landmark, User, LogOut, MessageSquare, 
          Send, Plus, X, FileText, 
          ShieldCheck, QrCode, Paperclip, 
          Search, Lock, UserCircle, ChevronDown,
          Globe, Briefcase, FileIcon, XCircle, 
          Share2, Copy, Check, Trash2, Save,
          MoreVertical, Filter, Database as FileSearch,
          CornerUpRight, Undo2, Bot, Sparkles, Loader2,
          Download, Eye, AlertCircle, KeyRound, ExternalLink
        } from 'lucide-react';

        // --- КОНСТАНТЫ СИСТЕМЫ ---
        const TVPK_DEPARTMENTS = [
          'Кафедра Вычислительной техники и ПО',
          'Кафедра Информационных систем',
          'Кафедра Информационной безопасности',
          'Кафедра Электроэнергетики',
          'Кафедра Автоматизации и управления',
          'Кафедра Радиоэлектроники',
          'Кафедра Архитектуры',
          'Кафедра Гражданского строительства',
          'Кафедра Геодезии',
          'Кафедра Языковых дисциплин',
          'Кафедра Социально-гуманитарных наук',
          'Кафедра Физико-математических дисциплин',
          'Учебный отдел',
          'Отдел кадров',
          'Бухгалтерия'
        ];

        const POSITIONS = [
          'Директор',
          'Заместитель директора',
          'Заведующий кафедрой',
          'Преподаватель спец. дисциплин',
          'Методист',
          'Специалист отдела кадров'
        ];

        const INITIAL_USERS = [
          { id: 3, login: 'alexsandr', password: '123', name: 'Гильденберг Александр Александрович', position: 'Директор ТВПК', photo: 'https://pikuco.ru/upload/test_stable/96f/96f16307baf2dc7656e92f16e392415f.webp', dept: 'Дирекция' },
          { id: 2, login: 'damir', password: '123', name: 'Гурже-оглы Дамир Османович', position: 'Зам. директора по УР', photo: 'https://i1.sndcdn.com/artworks-3N522jeOWiKL8bzo-No7iyg-t500x500.png', dept: 'Учебный отдел' },
          { id: 1, login: 'kamal', password: '123', name: 'Осман-оглы Камал Максимович', position: 'Преподаватель спец. дисциплин', photo: 'https://img.freepik.com/free-photo/close-up-businessman-portrait-with-hands-crossed_158595-2940.jpg?semt=ais_hybrid&w=740&q=80', dept: 'Кафедра ВТиПО' },
          { id: 4, login: 'ivanov', password: '123', name: 'Иванов Петр Сергеевич', position: 'Заведующий кафедрой', photo: 'https://img.freepik.com/free-photo/young-bearded-man-with-striped-shirt_273609-5677.jpg', dept: 'Кафедра ВТиПО' },
          { id: 5, login: 'sidorova', password: '123', name: 'Сидорова Анна Павловна', position: 'Преподаватель программирования', photo: 'https://img.freepik.com/free-photo/lifestyle-people-emotions-concept-close-up-confident-young-woman-with-fringe-smiling_1258-59333.jpg', dept: 'Кафедра ИС' },
        ];

        const StaticCollegeQR = ({ sizePx = 2.5, isVisible = false }) => {
          if (!isVisible) return null;

          const url = "https://thpc.edu.kz/";
          const size = 21; 
          
          const getCell = (row, col) => {
            const checkFinder = (r, c) => {
              if (r < 7 && c < 7) return { r, c };
              if (r < 7 && c > 13) return { r, c: c - 14 };
              if (r > 13 && c < 7) return { r: r - 14, c };
              return null;
            };

            const finder = checkFinder(row, col);
            if (finder) {
              const { r, c } = finder;
              if (r === 0 || r === 6 || c === 0 || c === 6) return true;
              if (r >= 2 && r <= 4 && c >= 2 && c <= 4) return true;
              return false;
            }

            const patterns = [
                (row + col) % 2 === 0,
                (row * col) % 3 === 0,
                (row + col) % 3 === 0,
                (row * 7 + col * 3) % 10 < 5
            ];
            const hash = 742; 
            const dataSeed = (row * 13 + col * 17 + hash) % 100;
            
            if (row === 6 || col === 6) return (row + col) % 2 === 0;

            return dataSeed > 48;
          };

          const matrix = [];
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              matrix.push(getCell(r, c));
            }
          }

          return (
            <div 
              className="bg-white p-1 border border-slate-200 shadow-sm grid gap-0 cursor-pointer hover:scale-105 transition-transform" 
              onClick={(e) => { e.stopPropagation(); window.open(url, '_blank'); }}
              title="Перейти на сайт колледжа thpc.edu.kz"
              style={{ 
                gridTemplateColumns: `repeat(${size}, ${sizePx}px)`, 
                gridTemplateRows: `repeat(${size}, ${sizePx}px)` 
              }}
            >
              {matrix.map((isBlack, i) => (
                <div key={i} className={`${isBlack ? 'bg-black' : 'bg-transparent'}`} />
              ))}
            </div>
          );
        };

        const DailyDynamicQR = () => <StaticCollegeQR sizePx={2.5} isVisible={true} />;

        function App() {
          const [testUsers, setTestUsers] = useState(INITIAL_USERS);
          const [currentUser, setCurrentUser] = useState(null);
          const [login, setLogin] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [currentView, setCurrentView] = useState('profile');
          
          const [isResetModalOpen, setIsResetModalOpen] = useState(false);
          const [resetStep, setResetStep] = useState(1); 
          const [resetPhrase, setResetPhrase] = useState('');
          const [resetTargetLogin, setResetTargetLogin] = useState('');
          const [newPassword, setNewPassword] = useState('');
          const [resetError, setResetError] = useState('');

          const [chats, setChats] = useState([
            {
              id: 'welcome_system',
              participants: [3, 2, 1, 4, 5],
              label: 'Системные уведомления',
              messages: [
                {
                  id: 100,
                  senderId: 3,
                  senderName: 'Александр Гильденберг',
                  text: 'В систему интегрирована верификация через официальный ресурс. QR-код теперь ведет на thpc.edu.kz.',
                  date: new Date().toLocaleString(),
                  isOfficial: true,
                  signatureId: 'TVPK-OFFICIAL-VERIFY',
                  attachments: []
                }
              ]
            }
          ]);
          const [activeChatId, setActiveChatId] = useState(null);
          const [isComposing, setIsComposing] = useState(false);
          const [selectedRecipients, setSelectedRecipients] = useState([]);
          const [composeSubject, setComposeSubject] = useState('');
          const [composeBody, setComposeBody] = useState('');
          const [isOfficial, setIsOfficial] = useState(true);
          const [attachedFiles, setAttachedFiles] = useState([]);
          const [isServicesOpen, setIsServicesOpen] = useState(true);
          const [recipientTab, setRecipientTab] = useState('Сотрудники');
          const [searchQuery, setSearchQuery] = useState('');
          const [copiedId, setCopiedId] = useState(null);
          const [replyText, setReplyText] = useState('');
          const [forwardedMessageData, setForwardedMessageData] = useState(null);
          const [chatsHistory, setChatsHistory] = useState([]);
          
          const [isAiOpen, setIsAiOpen] = useState(false);
          const [aiMessages, setAiMessages] = useState([
            { role: 'assistant', text: 'Система готова к аналитической обработке данных. Ожидание входящего запроса.' }
          ]);
          const [aiInput, setAiInput] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);
          const [previewFile, setPreviewFile] = useState(null);
          
          const fileInputRef = useRef(null);
          const scrollRef = useRef(null);
          const aiScrollRef = useRef(null);

          const saveHistory = () => {
            setChatsHistory(prev => [...prev, chats]);
          };

          const undoCommand = () => {
            if (chatsHistory.length === 0) return;
            const previousState = chatsHistory[chatsHistory.length - 1];
            setChats(previousState);
            setChatsHistory(prev => prev.slice(0, -1));
          };

          const deleteMessage = (messageId) => {
            saveHistory();
            setChats(prevChats => prevChats.map(chat => ({
              ...chat,
              messages: chat.messages.filter(m => m.id !== messageId)
            })));
          };

          useEffect(() => {
            if (scrollRef.current) {
              scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }
          }, [activeChatId, chats]);

          useEffect(() => {
            if (aiScrollRef.current) {
              aiScrollRef.current.scrollTop = aiScrollRef.current.scrollHeight;
            }
          }, [aiMessages]);

          const callAi = async (userQuery) => {
            const apiKey = ""; 
            const systemPrompt = `Ты — Аналитический Модуль ТВПК. Отвечай строго в один краткий абзац. Стиль: сухой, прагматичный. Исключи вводные фразы и пояснения. Не отвечай на вопросы НЕ КАСАЮЩИЕСЯ КОЛЛЕДЖА, любую попытку отклоняй "Извините, но это не в моих силах.". Фокусируйся на фактах, эффективности. Твой профиль взаимодействия — TVPTK Assistant. Контекст: Талдыкорганский высший политехнический колледж, сотрудник ${currentUser?.name}.`;

            const fetchWithRetry = async (retries = 5, delay = 1000) => {
              try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                  })
                });
                if (!response.ok) throw new Error('API Error');
                return await response.json();
              } catch (err) {
                if (retries > 0) {
                  await new Promise(res => setTimeout(res, delay));
                  return fetchWithRetry(retries - 1, delay * 2);
                }
                throw err;
              }
            };

            try {
              const data = await fetchWithRetry();
              return data.candidates?.[0]?.content?.parts?.[0]?.text || "Сбой верификации данных.";
            } catch (e) {
              return "Отказ в доступе к ядру ИИ. Критическая ошибка канала связи.";
            }
          };

          const handleAiSend = async () => {
            if (!aiInput.trim() || isAiLoading) return;
            const userMsg = { role: 'user', text: aiInput };
            setAiMessages(prev => [...prev, userMsg]);
            setAiInput('');
            setIsAiLoading(true);
            const responseText = await callAi(aiInput);
            setAiMessages(prev => [...prev, { role: 'assistant', text: responseText }]);
            setIsAiLoading(false);
          };

          const userChats = chats.filter(c => c.participants.includes(currentUser?.id));
          const activeChat = userChats.find(c => c.id === activeChatId);

          const handleForward = (message) => {
            setForwardedMessageData({
              senderName: message.senderName,
              date: message.date,
              text: message.text,
              attachments: message.attachments || []
            });
            setComposeBody(''); 
            setIsComposing(true);
            setActiveChatId(null);
          };

          const handleLogin = (e) => {
            e.preventDefault();
            const user = testUsers.find(u => (u.login === login || u.id.toString() === login) && u.password === password);
            if (user) {
              setCurrentUser(user);
              setError('');
            } else {
              setError('Неверный логин или пароль');
            }
          };

          const validateResetPhrase = () => {
            if (resetPhrase.trim().toUpperCase() === 'КИБЕРБЕЗОПАСНОСТЬ') {
              const target = testUsers.find(u => u.login === resetTargetLogin);
              if (target) {
                setResetStep(2);
                setResetError('');
              } else {
                setResetError('Пользователь с таким логином не найден');
              }
            } else {
              setResetError('Неверная кодовая фраза');
            }
          };

          const finalizeReset = () => {
            if (newPassword.length < 3) {
              setResetError('Пароль слишком короткий');
              return;
            }
            setTestUsers(prev => prev.map(u => u.login === resetTargetLogin ? { ...u, password: newPassword } : u));
            setIsResetModalOpen(false);
            setResetStep(1);
            setResetPhrase('');
            setResetTargetLogin('');
            setNewPassword('');
            setResetError('');
            setError('Пароль успешно обновлен. Используйте новые данные.');
          };

          const handleCopy = (text, id) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            setCopiedId(id);
            setTimeout(() => setCopiedId(null), 2000);
          };

          const handleFileAttach = (e) => {
            const files = Array.from(e.target.files);
            setAttachedFiles(prev => [...prev, ...files.map(f => ({ 
              id: Math.random(),
              name: f.name, 
              size: (f.size / 1024 / 1024).toFixed(2) + ' MB',
              date: new Date().getTime(),
              url: URL.createObjectURL(f),
              type: f.type
            }))]);
            e.target.value = '';
          };

          const removeFile = (id) => {
            setAttachedFiles(prev => prev.filter(f => f.id !== id));
          };

          const toggleRecipient = (item, type) => {
            const itemId = type === 'user' ? item.id : item;
            setSelectedRecipients(prev => 
              prev.find(r => r.id === itemId) 
                ? prev.filter(r => r.id !== itemId) 
                : [...prev, { id: itemId, name: type === 'user' ? item.name : item, type }]
            );
          };

          const startNewChat = () => {
            if (selectedRecipients.length === 0 || (!composeBody.trim() && !forwardedMessageData && attachedFiles.length === 0)) return;
            let updatedChats = [...chats];
            let firstChatId = null;
            selectedRecipients.forEach(recipient => {
              const sigId = isOfficial ? `TVPK-SIG-${Math.floor(Math.random() * 90000 + 10000)}` : null;
              const newMessage = {
                id: Date.now() + Math.random(),
                senderId: currentUser.id,
                senderName: currentUser.name,
                subject: composeSubject,
                text: composeBody,
                date: new Date().toLocaleString(),
                isOfficial,
                signatureId: sigId,
                attachments: [...attachedFiles],
                forwardedFrom: forwardedMessageData
              };
              const existingChatIndex = updatedChats.findIndex(c => 
                c.participants.length === 2 && 
                c.participants.includes(currentUser.id) && 
                c.participants.includes(recipient.id)
              );
              if (existingChatIndex !== -1) {
                const updatedChat = {
                  ...updatedChats[existingChatIndex],
                  messages: [...updatedChats[existingChatIndex].messages, newMessage]
                };
                updatedChats[existingChatIndex] = updatedChat;
                if (!firstChatId) firstChatId = updatedChat.id;
              } else {
                const newChat = {
                  id: `chat_${Date.now()}_${recipient.id}_${Math.random()}`,
                  participants: [currentUser.id, recipient.id],
                  messages: [newMessage],
                  label: recipient.name
                };
                updatedChats = [newChat, ...updatedChats];
                if (!firstChatId) firstChatId = newChat.id;
              }
            });
            saveHistory();
            setChats(updatedChats);
            setIsComposing(false);
            setSelectedRecipients([]);
            setComposeBody('');
            setComposeSubject('');
            setAttachedFiles([]);
            setForwardedMessageData(null);
            if (firstChatId) setActiveChatId(firstChatId);
          };

          const sendMessage = (chatId, text) => {
            if (!text.trim()) return;
            const newMessage = {
              id: Date.now(),
              senderId: currentUser.id,
              senderName: currentUser.name,
              text: text,
              date: new Date().toLocaleString(),
              isOfficial: false,
              attachments: []
            };
            saveHistory();
            setChats(prev => prev.map(chat => chat.id === chatId ? { ...chat, messages: [...chat.messages, newMessage] } : chat));
            setReplyText('');
          };

          if (!currentUser) {
            return (
              <div className="min-h-screen bg-slate-200 flex items-center justify-center font-sans p-4">
                <div className="w-full max-w-[420px] bg-[#f9f9f9] rounded-[30px] p-8 shadow-2xl border border-white/50 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 via-blue-600 to-yellow-400 opacity-80"></div>
                  <div className="flex flex-col items-center mb-8">
                    <div className="w-16 h-16 bg-[#1a2b5e] rounded-2xl flex items-center justify-center text-white mb-6 shadow-md">
                      <Landmark size={32} />
                    </div>
                    <h1 className="text-[#1a2b5e] text-center font-bold uppercase text-[15px] leading-tight mb-1 tracking-wide">
                      Талдыкорганский высший<br/>политехнический колледж
                    </h1>
                    <p className="text-[11px] text-slate-400 font-medium">Кабинет пользователя</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-6">
                    <div className="space-y-1.5">
                      <label className="text-[11px] font-bold text-slate-600 ml-1">Логин / ИИН</label>
                      <div className="relative">
                        <User size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input type="text" value={login} onChange={e => setLogin(e.target.value)} placeholder="Введите логин" className="w-full pl-12 pr-6 py-4 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600/10 text-sm font-medium transition-all" />
                      </div>
                    </div>
                    <div className="space-y-1.5">
                      <div className="flex justify-between items-center mb-0.5">
                         <label className="text-[11px] font-bold text-slate-600 ml-1">Пароль</label>
                         <button type="button" onClick={() => setIsResetModalOpen(true)} className="text-[10px] font-bold text-blue-600 hover:text-blue-800 transition-colors">Забыли пароль?</button>
                      </div>
                      <div className="relative">
                        <Lock size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Введите пароль" className="w-full pl-12 pr-6 py-4 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600/10 text-sm font-medium transition-all" />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-4 bg-[#1a2b5e] text-white rounded-xl font-bold text-sm uppercase tracking-wider hover:bg-blue-800 transition-all shadow-lg active:scale-[0.98]">Войти</button>
                  </form>
                  {error && <div className={`mt-4 p-3 border rounded-xl text-xs font-bold text-center ${error.includes('успешно') ? 'bg-green-50 border-green-100 text-green-600' : 'bg-red-50 border-red-100 text-red-500'}`}>{error}</div>}
                </div>

                {isResetModalOpen && (
                  <div className="fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="w-full max-w-[380px] bg-white rounded-3xl p-8 shadow-2xl border border-slate-100 relative overflow-hidden">
                       <div className="absolute top-0 left-0 w-full h-1 bg-blue-600"></div>
                       <div className="flex justify-between items-start mb-6">
                         <div>
                            <h2 className="text-[14px] font-black uppercase text-slate-900 leading-tight">Сброс доступа</h2>
                            <p className="text-[10px] font-medium text-slate-400 uppercase tracking-tighter">Верификация личности</p>
                         </div>
                         <button onClick={() => {setIsResetModalOpen(false); setResetStep(1); setResetError('');}} className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400"><X size={18}/></button>
                       </div>

                       {resetStep === 1 ? (
                         <div className="space-y-4">
                            <div className="flex items-center gap-4 p-3 bg-blue-50 border border-blue-100 rounded-xl">
                               <div className="shrink-0">
                                  <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=КИБЕРБЕЗОПАСНОСТЬ" alt="QR Сброс" className="w-16 h-16 rounded shadow-sm border border-blue-200 bg-white p-0.5" />
                               </div>
                               <p className="text-[10px] font-medium text-blue-800 leading-relaxed uppercase">Отсканируйте QR-токен для получения фразы или введите кодовые данные вручную для инициализации сброса.</p>
                            </div>
                            <div className="space-y-3">
                               <input 
                                 type="text" 
                                 value={resetTargetLogin} 
                                 onChange={e => setResetTargetLogin(e.target.value)} 
                                 placeholder="Логин пользователя" 
                                 className="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none text-xs font-bold transition-all" 
                               />
                               <div className="relative">
                                  <KeyRound size={14} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                                  <input 
                                    type="text" 
                                    value={resetPhrase} 
                                    onChange={e => setResetPhrase(e.target.value)} 
                                    placeholder="Кодовая фраза" 
                                    className="w-full pl-10 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none text-xs font-bold uppercase transition-all" 
                                  />
                               </div>
                            </div>
                            {resetError && <div className="text-[9px] font-black text-red-500 uppercase bg-red-50 p-2 rounded-lg text-center border border-red-100">{resetError}</div>}
                            <button onClick={validateResetPhrase} className="w-full py-3.5 bg-[#1a2b5e] text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-800 transition-all shadow-md">Проверить данные</button>
                         </div>
                       ) : (
                         <div className="space-y-4">
                            <div className="p-3 bg-green-50 border border-green-100 rounded-xl flex gap-3 items-start">
                               <Check size={18} className="text-green-600 shrink-0 mt-0.5" />
                               <p className="text-[10px] font-medium text-green-800 leading-relaxed uppercase tracking-tight">Личность подтверждена. Установите новый мастер-пароль для аккаунта <span className="font-black">"{resetTargetLogin}"</span>.</p>
                            </div>
                            <div className="relative">
                              <Lock size={14} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                              <input 
                                type="password" 
                                value={newPassword} 
                                onChange={e => setNewPassword(e.target.value)} 
                                placeholder="Новый пароль" 
                                className="w-full pl-10 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-100 outline-none text-xs font-bold transition-all" 
                              />
                            </div>
                            {resetError && <div className="text-[9px] font-black text-red-500 uppercase bg-red-50 p-2 rounded-lg text-center border border-red-100">{resetError}</div>}
                            <button onClick={finalizeReset} className="w-full py-3.5 bg-green-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-green-700 transition-all shadow-md">Обновить пароль</button>
                         </div>
                       )}
                    </div>
                  </div>
                )}
              </div>
            );
          }

          return (
            <div className="h-screen bg-[#f1f1f1] flex font-sans overflow-hidden relative">
              <aside className="w-64 bg-[#0f172a] text-white flex flex-col shrink-0 shadow-2xl z-20">
                <div className="p-8 flex flex-col items-center">
                  <Landmark size={28} className="text-blue-400 mb-3" />
                  <span className="font-bold text-[10px] tracking-[0.2em] uppercase opacity-60 text-center">Цифровая экосистема</span>
                </div>
                <nav className="flex-1 px-3 mt-4 space-y-1">
                  <button onClick={() => {setCurrentView('profile'); setIsComposing(false)}} className={`w-full flex items-center p-3.5 rounded-xl font-bold text-[10px] uppercase tracking-widest transition-all ${currentView === 'profile' ? 'bg-blue-600 shadow-lg' : 'text-slate-400 hover:bg-white/5'}`}>
                    <UserCircle size={18} className="mr-3" /> Профиль
                  </button>
                  <button onClick={() => setIsServicesOpen(!isServicesOpen)} className="w-full flex items-center justify-between p-3.5 rounded-xl font-bold text-[10px] uppercase tracking-widest text-slate-400 hover:bg-white/5">
                    <div className="flex items-center"><Globe size={18} className="mr-3" /> Цифровые услуги</div>
                    <ChevronDown size={14} className={isServicesOpen ? 'rotate-180' : ''} />
                  </button>
                  {isServicesOpen && (
                    <div className="ml-3 space-y-1">
                      <button onClick={() => {setCurrentView('messenger'); setIsComposing(false)}} className={`w-full flex items-center p-3 rounded-xl font-bold text-[9px] uppercase tracking-widest transition-all ${currentView === 'messenger' ? 'bg-blue-600/20 text-blue-400' : 'text-slate-500 hover:text-white'}`}>
                        <MessageSquare size={16} className="mr-3" /> Мессенджер
                      </button>
                    </div>
                  )}
                  <button onClick={() => setIsAiOpen(!isAiOpen)} className={`w-full flex items-center p-3.5 rounded-xl font-bold text-[10px] uppercase tracking-widest transition-all mt-4 border border-dashed border-white/20 hover:bg-white/5 ${isAiOpen ? 'text-blue-400 border-blue-400/50' : 'text-slate-500'}`}>
                    <Bot size={18} className="mr-3" /> Ассистент
                  </button>
                </nav>

                <div className="p-4 border-t border-white/5 bg-slate-900/50">
                   <button onClick={() => setCurrentUser(null)} className="w-full flex items-center justify-center space-x-2 py-3 bg-red-500/10 rounded-xl text-[10px] font-bold uppercase text-red-400 hover:bg-red-500/20 transition-all">
                     <LogOut size={14}/><span>Выход</span>
                   </button>
                </div>
              </aside>

              <main className="flex-1 flex flex-col overflow-hidden bg-white">
                <header className="px-8 py-5 border-b border-slate-200 flex justify-between items-center shadow-sm z-10">
                  <div className="flex items-center gap-4">
                    <h2 className="text-[11px] font-black uppercase tracking-[0.2em] text-slate-800">
                      ТВПК / {currentView === 'profile' ? 'ПРОФИЛЬ' : isComposing ? 'РАССЫЛКА' : 'СООБЩЕНИЯ'}
                    </h2>
                    {chatsHistory.length > 0 && (
                      <button onClick={undoCommand} className="flex items-center gap-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[9px] font-bold uppercase transition-all">
                        <Undo2 size={12} /> Отменить
                      </button>
                    )}
                  </div>
                  <div className="flex items-center space-x-4">
                    <div className="text-right">
                      <div className="text-[10px] font-bold uppercase leading-none mb-1">{currentUser.name}</div>
                      <div className="text-[9px] font-medium text-blue-600 uppercase opacity-60 leading-none">{currentUser.position}</div>
                    </div>
                    <img src={currentUser.photo} className="w-9 h-9 rounded-lg object-cover ring-2 ring-slate-100" alt="User" />
                  </div>
                </header>

                <div className="flex-1 overflow-hidden">
                  {currentView === 'profile' ? (
                    <div className="h-full p-10 overflow-auto flex justify-center">
                      <div className="w-full max-w-3xl bg-white rounded-3xl p-10 border border-slate-100 shadow-xl flex space-x-10 h-max">
                        <img src={currentUser.photo} className="w-56 h-56 rounded-3xl object-cover shadow-2xl border-4 border-white" alt="Profile" />
                        <div className="flex-1 py-2 relative">
                          <h3 className="text-2xl font-black uppercase text-slate-900 mb-2">{currentUser.name}</h3>
                          <div className="px-3 py-1 bg-blue-50 text-blue-600 text-[9px] font-black uppercase rounded-lg inline-block mb-8">{currentUser.position}</div>
                          
                          <div className="grid grid-cols-1 gap-6 pt-6 border-t border-slate-50">
                            <div>
                              <span className="text-[9px] font-black text-slate-400 uppercase block mb-1 tracking-widest">Место работы</span>
                              <span className="text-sm font-bold text-slate-800">{currentUser.dept}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="h-full flex">
                      {!isComposing && (
                        <div className="w-72 border-r border-slate-100 flex flex-col bg-slate-50/30">
                          <div className="p-4">
                            <button onClick={() => {setIsComposing(true); setActiveChatId(null)}} className="w-full py-3.5 bg-blue-600 text-white rounded-xl font-bold text-[10px] uppercase tracking-widest flex items-center justify-center hover:bg-slate-900 transition-all shadow-lg active:scale-95">
                              <Plus size={16} className="mr-2" /> Создать
                            </button>
                          </div>
                          <div className="flex-1 overflow-auto p-2 space-y-1">
                             {userChats.map(chat => (
                               <button key={chat.id} onClick={() => setActiveChatId(chat.id)} className={`w-full p-4 rounded-xl flex items-center space-x-3 transition-all ${activeChatId === chat.id ? 'bg-white shadow-md border border-slate-100' : 'hover:bg-white/50'}`}>
                                 <div className="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs shrink-0 uppercase">{ (chat.participants.length === 2 ? testUsers.find(u => u.id === chat.participants.find(p => p !== currentUser.id))?.name : chat.label)?.charAt(0) }</div>
                                 <div className="text-left overflow-hidden">
                                    <div className="text-[10px] font-bold uppercase text-slate-900 truncate">{ chat.participants.length === 2 ? testUsers.find(u => u.id === chat.participants.find(p => p !== currentUser.id))?.name : chat.label }</div>
                                    <div className="text-[9px] font-medium text-slate-400 truncate uppercase italic">{chat.messages[chat.messages.length - 1]?.text.substring(0, 20)}...</div>
                                 </div>
                               </button>
                             ))}
                          </div>
                        </div>
                      )}
                      <div className="flex-1 overflow-hidden bg-[#e9ebef]/40 relative flex flex-col">
                        {isComposing ? (
                          <div className="h-full flex flex-col">
                            <div className="bg-[#f2f2f2] border-b border-slate-300 px-6 py-2.5 flex justify-between items-center shadow-sm">
                               <span className="text-[11px] font-bold text-slate-600 uppercase tracking-wide">Новая рассылка</span>
                               <button onClick={() => {setIsComposing(false); setForwardedMessageData(null)}} className="p-1 hover:bg-slate-200 rounded text-slate-400"><X size={16}/></button>
                            </div>
                            <div className="flex-1 flex overflow-hidden p-6 gap-6">
                              <div className="w-1/4 flex flex-col gap-4">
                                <div className="flex flex-col flex-1 bg-white border border-slate-300 p-4 shadow-sm overflow-hidden rounded-md">
                                   <div className="text-[10px] font-bold text-slate-400 uppercase mb-2">СООБЩЕНИЕ</div>
                                   {forwardedMessageData && (
                                     <div className="mb-4 pl-3 border-l-2 border-slate-900 bg-slate-50 p-2 relative group rounded-r">
                                        <div className="flex items-center text-[10px] text-slate-400 italic mb-1"><CornerUpRight size={10} className="mr-1" /> Пересланное сообщение</div>
                                        <div className="text-[11px] font-bold text-slate-600 uppercase">{forwardedMessageData.senderName}</div>
                                        <div className="text-[12px] text-slate-500 line-clamp-2 italic">{forwardedMessageData.text}</div>
                                        <button onClick={() => setForwardedMessageData(null)} className="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-red-400"><X size={12}/></button>
                                     </div>
                                   )}
                                   <textarea className="flex-1 w-full bg-transparent border-none resize-none text-[12px] font-medium outline-none text-slate-700 leading-relaxed" placeholder="Введите текст сообщения..." value={composeBody} onChange={e => setComposeBody(e.target.value)} />
                                </div>
                                <div className="h-1/3 bg-white border border-slate-300 p-4 flex flex-col shadow-sm rounded-md">
                                   <div className="text-[10px] font-bold text-slate-400 uppercase mb-2">ФАЙЛЫ ({attachedFiles.length})</div>
                                   <div className="flex-1 overflow-auto space-y-1 pr-1">
                                     {attachedFiles.map(file => (
                                       <div key={file.id} className="flex items-center justify-between p-2 bg-slate-50 border border-slate-200 rounded group">
                                          <div className="flex items-center space-x-2 truncate"><FileIcon size={12} className="text-blue-500 shrink-0"/><span className="text-[10px] font-medium text-slate-600 truncate">{file.name}</span></div>
                                          <button onClick={() => removeFile(file.id)} className="text-slate-300 hover:text-red-500"><X size={12}/></button>
                                       </div>
                                     ))}
                                   </div>
                                   <button onClick={() => fileInputRef.current.click()} className="mt-3 w-full px-4 py-2 bg-slate-100 border border-slate-300 text-[10px] font-bold uppercase text-slate-600 hover:bg-slate-200 transition-colors rounded">Добавить файл</button>
                                   <input type="file" ref={fileInputRef} className="hidden" multiple onChange={handleFileAttach} />
                                </div>
                              </div>
                              <div className="w-1/3 flex flex-col bg-white border border-slate-300 shadow-sm rounded-md">
                                <div className="p-4 border-b border-slate-200">
                                  <div className="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-widest text-center">ВЫБОР ПОЛУЧАТЕЛЕЙ</div>
                                  <div className="flex gap-1 mb-4">
                                    {['Структуры', 'Должности', 'Сотрудники'].map(tab => (
                                      <button key={tab} onClick={() => setRecipientTab(tab)} className={`flex-1 py-1.5 text-[9px] font-bold uppercase border transition-all rounded-sm ${recipientTab === tab ? 'bg-slate-100 border-slate-400 text-slate-800' : 'bg-slate-50 border-slate-200 text-slate-400 hover:bg-white'}`}>{tab}</button>
                                    ))}
                                  </div>
                                  <div className="relative">
                                    <input type="text" className="w-full bg-slate-50 border border-slate-200 p-2 text-[11px] outline-none font-medium rounded-sm" placeholder="Поиск..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                                    <Search size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300" />
                                  </div>
                                </div>
                                <div className="flex-1 overflow-auto p-2 space-y-1">
                                  {recipientTab === 'Структуры' && TVPK_DEPARTMENTS.filter(d => d.toLowerCase().includes(searchQuery.toLowerCase())).map(dept => (
                                    <div key={dept} onClick={() => toggleRecipient(dept, 'dept')} className={`p-3 text-[10px] font-bold uppercase cursor-pointer border rounded transition-all ${selectedRecipients.find(r => r.id === dept) ? 'bg-blue-50 border-blue-200 text-blue-800' : 'hover:bg-slate-50 border-transparent text-slate-600'}`}>{dept}</div>
                                  ))}
                                  {recipientTab === 'Должности' && POSITIONS.filter(p => p.toLowerCase().includes(searchQuery.toLowerCase())).map(pos => (
                                    <div key={pos} onClick={() => toggleRecipient(pos, 'position')} className={`p-3 text-[10px] font-bold uppercase cursor-pointer border rounded transition-all ${selectedRecipients.find(r => r.id === pos) ? 'bg-blue-50 border-blue-200 text-blue-800' : 'hover:bg-slate-50 border-transparent text-slate-600'}`}>{pos}</div>
                                  ))}
                                  {recipientTab === 'Сотрудники' && testUsers.filter(u => u.name.toLowerCase().includes(searchQuery.toLowerCase())).map(u => (
                                    <div key={u.id} onClick={() => toggleRecipient(u, 'user')} className={`p-3 text-[10px] font-bold uppercase cursor-pointer border rounded transition-all ${selectedRecipients.find(r => r.id === u.id) ? 'bg-blue-50 border-blue-200 text-blue-800' : 'hover:bg-slate-50 border-transparent text-slate-600'}`}>{u.name}<div className="text-[8px] font-medium opacity-50 lowercase mt-0.5">{u.dept}</div></div>
                                  ))}
                                </div>
                              </div>
                              <div className="flex-1 flex flex-col bg-white border border-slate-300 shadow-sm rounded-md overflow-hidden">
                                <div className="p-4 border-b border-slate-200 bg-slate-50/50 flex justify-between items-center">
                                  <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ИТОГОВЫЙ СПИСОК ({selectedRecipients.length})</div>
                                  <button onClick={() => setSelectedRecipients([])} className="p-1.5 hover:bg-red-50 text-red-400 rounded transition-colors"><Trash2 size={14}/></button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 space-y-1">
                                   {selectedRecipients.map(r => (
                                     <div key={r.id} className="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded group hover:border-blue-300 transition-all">
                                        <div className="flex items-center space-x-2"><div className={`w-1.5 h-1.5 rounded-full ${r.type === 'dept' ? 'bg-blue-500' : r.type === 'user' ? 'bg-green-500' : 'bg-orange-500'}`}></div><span className="text-[10px] font-bold uppercase text-slate-700 truncate">{r.name}</span></div>
                                        <button onClick={() => toggleRecipient(r.id, r.type)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><XCircle size={14}/></button>
                                     </div>
                                   ))}
                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-3">
                                   <button onClick={() => {setIsComposing(false); setForwardedMessageData(null)}} className="px-4 py-2.5 bg-white border border-slate-300 text-[10px] font-bold uppercase text-slate-600 hover:bg-slate-100 transition-all rounded">Отмена</button>
                                   <button onClick={startNewChat} className="px-6 py-2.5 bg-[#be1e2d] text-white text-[10px] font-bold uppercase tracking-[0.1em] shadow-lg hover:bg-red-700 transition-all active:scale-95 rounded flex items-center"><Check size={14} className="mr-2"/> Подписать и отправить</button>
                                </div>
                              </div>
                            </div>
                          </div>
                        ) : activeChat ? (
                          <div className="h-full flex flex-col bg-white">
                            <div className="p-4 border-b border-slate-100 flex items-center justify-between shadow-sm bg-white z-10">
                               <div className="flex items-center space-x-4">
                                  <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-md font-black uppercase">{ (activeChat.participants.length === 2 ? testUsers.find(u => u.id === activeChat.participants.find(p => p !== currentUser.id))?.name : activeChat.label)?.charAt(0) }</div>
                                  <div>
                                    <h3 className="text-xs font-black uppercase text-slate-900 tracking-wide">{ activeChat.participants.length === 2 ? testUsers.find(u => u.id === activeChat.participants.find(p => p !== currentUser.id))?.name : activeChat.label }</h3>
                                    <div className="flex items-center text-[9px] font-bold text-green-500 uppercase tracking-widest mt-0.5"><span className="w-1.5 h-1.5 bg-green-500 rounded-full mr-1.5 animate-pulse"></span> Активен</div>
                                  </div>
                               </div>
                               <button className="p-2 hover:bg-slate-100 rounded-lg text-slate-400 transition-colors"><MoreVertical size={18}/></button>
                            </div>
                            <div ref={scrollRef} className="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50/50">
                               {activeChat.messages.map(m => (
                                 <div key={m.id} className={`flex flex-col ${m.senderId === currentUser.id ? 'items-end' : 'items-start'}`}>
                                   <div className={`group relative max-w-[75%] p-6 rounded-2xl shadow-sm border ${m.senderId === currentUser.id ? 'bg-[#1e293b] text-white border-transparent' : 'bg-white text-slate-800 border-slate-200'}`}>
                                     {m.forwardedFrom && (
                                       <div className={`mb-4 pl-4 border-l-2 ${m.senderId === currentUser.id ? 'border-blue-400 bg-white/5' : 'border-slate-400 bg-slate-50'} py-2 pr-4 rounded-r-lg transition-all`}>
                                          <div className={`flex items-center text-[9px] font-black uppercase tracking-[0.1em] mb-1 ${m.senderId === currentUser.id ? 'text-blue-300' : 'text-slate-400'}`}><CornerUpRight size={12} className="mr-1.5" /> Пересланное сообщение</div>
                                          <div className={`text-[10px] font-bold uppercase mb-1 tracking-tight ${m.senderId === currentUser.id ? 'text-white' : 'text-slate-900'}`}>{m.forwardedFrom.senderName}</div>
                                          <div className={`text-[11px] italic leading-relaxed line-clamp-3 ${m.senderId === currentUser.id ? 'text-slate-300' : 'text-slate-500'}`}>{m.forwardedFrom.text}</div>
                                       </div>
                                     )}
                                     <div className="text-[13px] leading-relaxed break-words whitespace-pre-wrap">{m.text}</div>
                                     {m.attachments && m.attachments.length > 0 && (
                                       <div className="mt-4 space-y-2">
                                         {m.attachments.map(att => (
                                           <div key={att.id} className={`flex items-center p-2.5 rounded-lg border ${m.senderId === currentUser.id ? 'border-slate-600 bg-slate-800/50' : 'border-slate-200 bg-slate-50'}`}>
                                             <FileIcon size={14} className="mr-2.5 text-blue-400" />
                                             <span className="text-[11px] font-bold truncate flex-1">{att.name}</span>
                                             <span className="text-[9px] font-medium ml-2 text-slate-400 mr-3">{att.size}</span>
                                             <div className="flex gap-2">
                                               {att.url && (
                                                 <>
                                                   <button onClick={() => setPreviewFile(att)} className="p-1 hover:bg-white/10 rounded text-blue-400 transition-colors" title="Предпросмотр"><Eye size={14} /></button>
                                                   <a href={att.url} download={att.name} className="p-1 hover:bg-white/10 rounded text-green-400 transition-colors" title="Скачать"><Download size={14} /></a>
                                                 </>
                                               )}
                                             </div>
                                           </div>
                                         ))}
                                       </div>
                                     )}
                                     {m.isOfficial && (
                                       <div className={`mt-5 pt-4 border-t flex items-center justify-between ${m.senderId === currentUser.id ? 'border-slate-700' : 'border-slate-100'}`}>
                                         <div className="flex items-center gap-3">
                                           <DailyDynamicQR />
                                           <div>
                                             <div className={`text-[8px] font-black uppercase tracking-widest mb-0.5 ${m.senderId === currentUser.id ? 'text-green-400' : 'text-green-600'}`}>ВЕРИФИЦИРОВАНО (THPC)</div>
                                             <div className={`text-[10px] font-mono tracking-tight ${m.senderId === currentUser.id ? 'text-slate-300' : 'text-slate-500'}`}>{m.signatureId}</div>
                                           </div>
                                         </div>
                                       </div>
                                     )}
                                     <div className={`mt-3 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider ${m.senderId === currentUser.id ? 'text-slate-400' : 'text-slate-400'}`}>
                                       <span>{m.date}</span>
                                       <div className="flex gap-2">
                                         {m.senderId === currentUser.id && (
                                           <button onClick={() => deleteMessage(m.id)} className="opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-500 flex items-center gap-1"><Trash2 size={10} /> <span>Удалить</span></button>
                                         )}
                                         <button onClick={() => handleForward(m)} className="opacity-0 group-hover:opacity-100 transition-opacity hover:text-blue-500 flex items-center gap-1"><Share2 size={10} /> <span>Переслать</span></button>
                                       </div>
                                     </div>
                                   </div>
                                 </div>
                               ))}
                            </div>
                            <div className="p-4 bg-white border-t border-slate-200">
                              <div className="flex items-center space-x-3 bg-slate-50 p-1.5 rounded-xl border border-slate-200 focus-within:border-blue-400 focus-within:ring-4 focus-within:ring-blue-50 transition-all">
                                <button className="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-white rounded-lg transition-colors"><Paperclip size={18} /></button>
                                <input type="text" value={replyText} onChange={(e) => setReplyText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && sendMessage(activeChat.id, replyText)} placeholder="Написать сообщение..." className="flex-1 bg-transparent border-none focus:outline-none text-[13px] font-medium text-slate-700" />
                                <button onClick={() => sendMessage(activeChat.id, replyText)} className="p-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm active:scale-95"><Send size={16} /></button>
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="h-full flex flex-col items-center justify-center text-slate-400 bg-slate-50/50">
                            <MessageSquare size={48} className="mb-4 opacity-20" />
                            <span className="text-[11px] font-bold uppercase tracking-widest text-slate-500">Выберите диалог из списка слева</span>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </main>

              {isAiOpen && (
                <div className="absolute bottom-6 right-6 w-96 h-[500px] bg-white rounded-2xl shadow-2xl z-50 border border-slate-200 flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-300">
                  <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center shadow-inner"><Bot size={18} /></div>
                      <div>
                        <div className="text-[10px] font-black uppercase tracking-widest text-blue-400">Invisible Operator</div>
                        <div className="text-[8px] font-bold text-slate-400 uppercase leading-tight tracking-tight">Analytical Core v2.5</div>
                      </div>
                    </div>
                    <button onClick={() => setIsAiOpen(false)} className="p-1.5 hover:bg-white/10 rounded-lg transition-colors"><X size={18} /></button>
                  </div>
                  <div ref={aiScrollRef} className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                    {aiMessages.map((m, idx) => (
                      <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] p-3 rounded-xl text-xs font-medium leading-relaxed shadow-sm ${m.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-slate-700 border border-slate-200 rounded-bl-none'}`}>{m.text}</div>
                      </div>
                    ))}
                    {isAiLoading && (
                      <div className="flex justify-start">
                        <div className="bg-white p-3 rounded-xl border border-slate-200 flex items-center gap-2"><Loader2 size={14} className="animate-spin text-blue-600" /><span className="text-[10px] font-bold text-slate-400 uppercase">Расчет...</span></div>
                      </div>
                    )}
                  </div>
                  <div className="p-3 bg-white border-t border-slate-100">
                    <div className="relative flex items-center">
                      <input type="text" value={aiInput} onChange={e => setAiInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAiSend()} placeholder="Ввод запроса для анализа..." className="w-full pl-4 pr-12 py-3 bg-slate-100 border border-transparent focus:border-blue-400 focus:bg-white rounded-xl outline-none text-[11px] font-bold transition-all" />
                      <button onClick={handleAiSend} disabled={isAiLoading} className={`absolute right-1.5 p-2 bg-slate-900 text-white rounded-lg transition-all ${isAiLoading ? 'opacity-50' : 'hover:bg-blue-600'}`}><Send size={14} /></button>
                    </div>
                  </div>
                </div>
              )}

              {previewFile && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-8">
                  <div className="bg-white w-full max-w-4xl h-full max-h-[80vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                    <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                      <div className="flex items-center gap-3">
                        <FileText size={20} className="text-blue-500" />
                        <div>
                          <div className="text-[12px] font-bold uppercase text-slate-800 tracking-wider">{previewFile.name}</div>
                          <div className="text-[10px] font-medium text-slate-500 uppercase">{previewFile.type || 'Неизвестный формат'} • {previewFile.size}</div>
                        </div>
                      </div>
                      <button onClick={() => setPreviewFile(null)} className="p-2 hover:bg-slate-200 rounded-lg text-slate-500 transition-colors"><X size={20}/></button>
                    </div>
                    <div className="flex-1 bg-slate-100 flex items-center justify-center overflow-auto p-4 relative">
                      {previewFile.type?.startsWith('image/') ? (
                        <img src={previewFile.url} alt={previewFile.name} className="max-w-full max-h-full object-contain rounded shadow-sm" />
                      ) : previewFile.type?.startsWith('video/') ? (
                        <video src={previewFile.url} controls className="max-w-full max-h-full rounded shadow-sm" />
                      ) : previewFile.type === 'application/pdf' ? (
                        <iframe src={previewFile.url} className="w-full h-full border-none rounded shadow-sm" title={previewFile.name} />
                      ) : (
                        <div className="flex flex-col items-center justify-center text-slate-400">
                          <FileIcon size={64} className="mb-4 opacity-50" />
                          <span className="text-[12px] font-bold uppercase tracking-widest text-slate-500">Предпросмотр недоступен</span>
                          <a href={previewFile.url} download={previewFile.name} className="mt-4 px-6 py-2 bg-blue-600 text-white text-[10px] font-bold uppercase rounded hover:bg-blue-700 transition-all shadow-md flex items-center gap-2"><Download size={14}/> Скачать файл</a>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
